# Sightline price table. USD per 1M tokens. APPROXIMATE — fetched from public provider
# pricing pages on 2026-10-26 (see docs/pricing-sources.md). Edit freely; first match wins,
# so list specific patterns before general ones. `match` is an fnmatch glob on the model id
# (lower-cased, with any "provider/" prefix stripped).
as_of: "2026-10-26"
currency: USD
models:
  # --- Anthropic ---
  - {provider: anthropic, match: "claude-fable-5-1*", input: 10.0, output: 50.0, cache_read: 0.25}
  - {provider: anthropic, match: "claude-opus-5-5*",  input: 4.0,  output: 20.0, cache_read: 0.20, cache_write: 5.0}
  - {provider: anthropic, match: "claude-opus-*",     input: 5.0,  output: 25.0, cache_read: 0.50, cache_write: 6.25}
  - {provider: anthropic, match: "claude-sonnet-5-5*", input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.50}
  - {provider: anthropic, match: "claude-sonnet-5*",  input: 2.0,  output: 10.0, cache_read: 0.20, cache_write: 2.50}
  - {provider: anthropic, match: "claude-sonnet-4*",  input: 3.0,  output: 15.0, cache_read: 0.30, cache_write: 3.75}
  - {provider: anthropic, match: "claude-haiku-5-5*", input: 0.10, output: 0.50}
  - {provider: anthropic, match: "claude-haiku-4*",   input: 1.0,  output: 5.0,  cache_read: 0.10, cache_write: 1.25}
  # --- OpenAI ---
  - {provider: openai, match: "gpt-6-astra*",  input: 10.0, output: 50.0, cache_read: 1.0}
  - {provider: openai, match: "gpt-6.1-sol*",  input: 2.0,  output: 10.0, cache_read: 0.10}
  - {provider: openai, match: "gpt-6-sol*",    input: 2.0,  output: 10.0, cache_read: 0.20}
  - {provider: openai, match: "gpt-6-luna*",   input: 0.10, output: 0.50}
  - {provider: openai, match: "gpt-5.6-sol*",  input: 4.0,  output: 20.0}
  - {provider: openai, match: "gpt-5.6-terra*", input: 2.0, output: 12.0}
  - {provider: openai, match: "gpt-5.6-luna*", input: 0.20, output: 1.20}
  - {provider: openai, match: "gpt-5.5-mini*", input: 0.50, output: 3.0}
  - {provider: openai, match: "gpt-5.5*",      input: 5.0,  output: 30.0}
  - {provider: openai, match: "text-embedding-3-small*", input: 0.02, output: 0.0}
  - {provider: openai, match: "text-embedding-3-large*", input: 0.13, output: 0.0}
  # --- Google ---
  - {provider: gemini, match: "gemini-3.1-pro*",        input: 2.0,  output: 12.0}
  - {provider: gemini, match: "gemini-3.8-flash*",      input: 0.75, output: 3.75}
  - {provider: gemini, match: "gemini-3.5-flash-lite*", input: 0.30, output: 2.50}
  - {provider: gemini, match: "gemini-3.1-flash*",      input: 0.30, output: 2.50}

# Local models cost $0, but it is useful to know what the same tokens would have cost
# on a hosted model. Requests to these providers get usd=0 and shadow_usd priced as `as`.
shadow:
  ollama: {provider: anthropic, as: "claude-sonnet-5-5"}
