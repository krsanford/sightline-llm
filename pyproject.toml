[project]
name = "sightline"
version = "0.1.0"
description = "See every LLM call your Mac makes: which app, which model, what it cost, and what leaked."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Karl Sanford" }]
dependencies = [
  "mitmproxy>=12.2.3,<13",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pyyaml>=6.0",
]

[project.scripts]
sightline = "sightline.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.uv]
exclude-newer = "2026-10-12T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests", "acceptance"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]
